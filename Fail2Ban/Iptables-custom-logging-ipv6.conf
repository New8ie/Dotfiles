# ==============================================
# /etc/fail2ban/action.d/iptables-custom-logging-ipv6.conf
# Action Fail2Ban iptables/ip6tables generic untuk semua jail + log
# Mendukung IPv4 dan IPv6
# ==============================================
[Definition]

actionstart = /bin/bash -c "/usr/sbin/<ipcmd> -N f2b-<name> 2>/dev/null || true; /usr/sbin/<ipcmd> -A INPUT -p tcp -m multiport --dports <port> -j f2b-<name>; /usr/sbin/<ipcmd> -A f2b-<name> -j RETURN; echo \$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban <name>] chain created >> <logfile>"

actionstop = /bin/bash -c "/usr/sbin/<ipcmd> -D INPUT -p tcp -m multiport --dports <port> -j f2b-<name> 2>/dev/null || true; /usr/sbin/<ipcmd> -F f2b-<name> 2>/dev/null || true; /usr/sbin/<ipcmd> -X f2b-<name> 2>/dev/null || true; echo \$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban <name>] chain removed >> <logfile>"

actioncheck = /bin/bash -c "/usr/sbin/<ipcmd> -n -L INPUT | grep -q 'f2b-<name>'"

actionban = /bin/bash -c "/usr/sbin/<ipcmd> -I f2b-<name> 1 -s <ip> -j DROP; echo \$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban <name>] Banned <ip> >> <logfile>"

actionunban = /bin/bash -c "/usr/sbin/<ipcmd> -D f2b-<name> -s <ip> -j DROP 2>/dev/null || true; echo \$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban <name>] Unbanned <ip> >> <logfile>"

[Init]
ipcmd = iptables
logfile = /var/log/fail2ban-iptables.log

[Init?family=inet6]
ipcmd = ip6tables
logfile = /var/log/fail2ban-iptables.log
