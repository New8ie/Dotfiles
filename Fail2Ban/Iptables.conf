# Fail2Ban action: iptables block for Guacamole (IPv4 + IPv6)
# Otomatis ban/unban, tanpa log tambahan dan Cloudflare

[Definition]
actionstart =
actionstop =
actioncheck =

# Ban IP
actionban = \
    if echo "<ip>" | grep -q ":"; then \
        ip6tables -I INPUT -s <ip> -j DROP; \
    else \
        iptables -I INPUT -s <ip> -j DROP; \
    fi

# Unban IP
actionunban = \
    if echo "<ip>" | grep -q ":"; then \
        ip6tables -D INPUT -s <ip> -j DROP; \
    else \
        iptables -D INPUT -s <ip> -j DROP; \
    fi
