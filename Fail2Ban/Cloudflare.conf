# Author: Mohamad Fachmi
#
# Fail2Ban Action: Cloudflare API v4 Logging
# Features:
#   - Ban/unban IP via Cloudflare API
#   - Logging ke file
#   - Aman untuk Fail2Ban (format tanggal dan escape)
#
# IMPORTANT: Pastikan permissions file 640 karena berisi API token
# chmod 640 /etc/fail2ban/action.d/cloudflare-logging.conf

[Definition]

# Tidak ada perintah khusus saat start/stop/check
actionstart =
actionstop =
actioncheck =

# =====================
# Action BAN
# =====================
actionban = echo "$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban Cloudflare] Banning <ip>" >> <log>; \
            curl -s -X POST <_cf_api_prms> \
            -d '{"mode":"block","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"Fail2Ban <name>"}' \
            <_cf_api_url> >> <log> 2>&1

# =====================
# Action UNBAN
# =====================
actionunban = id=$(curl -s -X GET <_cf_api_prms> \
                   "<_cf_api_url>?mode=block&configuration_target=<cftarget>&configuration_value=<ip>&page=1&per_page=1" \
                   | jq -r '.result[0].id // empty'); \
              if [ -n "$id" ]; then \
                  echo "$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban Cloudflare] Unbanning <ip>" >> <log>; \
                  curl -s -X DELETE <_cf_api_prms> "<_cf_api_url>/$id" >> <log> 2>&1; \
              else \
                  echo "$(date '+%%Y-%%m-%%d %%H:%%M:%%S') [Fail2Ban Cloudflare] No rule found for <ip>, skipping unban" >> <log>; \
              fi

# =====================
# Cloudflare API Parameters
# =====================
_cf_api_url = https://api.cloudflare.com/client/v4/user/firewall/access_rules/rules
_cf_api_prms = -H 'X-Auth-Email: <cfuser>' -H 'X-Auth-Key: <cftoken>' -H 'Content-Type: application/json'

cftarget = ip6
cftoken = 123456789AAABBCCCddEEFFFggg54321
cfuser = youremail@example.com

cftarget = ip

[Init?family=inet6]
cftarget = ip6