# Fail2Ban Action: Cloudflare (API Key) with .env + logging
# Description:
#   This action integrates Fail2Ban with Cloudflare's Firewall API v4.
#   It supports IPv4 and IPv6 addresses and logs all ban/unban events.
#
# Requirements:
#   - curl
#   - jq (optional but recommended)
#
# Notes:
#   The Cloudflare credentials are stored securely in:
#     /root/.env/cloudflare
#   Logs are written to:
#     /var/log/fail2ban-cloudflare.log
#
# Permissions:
#   Make sure `jail.local` and `.env` files are permission 640 or stricter.
#
# The .env file located at /root/.env/cloudflare must contain:
#   CF_EMAIL="you@example.com"
#   API_KEY="your_global_api_key"
#   ZONE_ID="your_zone_id"

[Definition]
actionstart =
actionstop =
actioncheck =

# ACTION BAN
actionban = \
    ENV_FILE="/root/.env/cloudflare"; LOG_FILE="/var/log/fail2ban-cloudflare.log"; \
    [ -f "$ENV_FILE" ] || { echo "$(date '+%%d-%%m-%%Y %%H:%%M:%%S') [Cloudflare] ❌ ERROR: .env not found: $ENV_FILE" >> "$LOG_FILE"; exit 0; }; \
    . "$ENV_FILE"; \
    TARGET=$(echo "<ip>" | grep -q ":" && echo "ip6" || echo "ip"); \
    echo "$(date '+%%d-%%m-%%Y %%H:%%M:%%S') [Cloudflare] 🚫 Banning <ip> from jail <name>" >> "$LOG_FILE"; \
    curl -s -X POST "${CF_API}/zones/${ZONE_ID}/firewall/access_rules/rules" \
      -H "X-Auth-Email: ${CF_EMAIL}" -H "X-Auth-Key: ${API_KEY}" -H "Content-Type: application/json" \
      -d "{\"mode\":\"block\",\"configuration\":{\"target\":\"${TARGET}\",\"value\":\"<ip>\"},\"notes\":\"Fail2Ban <name>\"}" \
      >> "$LOG_FILE" 2>&1; \
    echo "" >> "$LOG_FILE";

# ACTION UNBAN
actionunban = \
    ENV_FILE="/root/.env/cloudflare"; LOG_FILE="/var/log/fail2ban-cloudflare.log"; \
    [ -f "$ENV_FILE" ] || { echo "$(date '+%%d-%%m-%%Y %%H:%%M:%%S') [Cloudflare] ❌ ERROR: .env not found: $ENV_FILE" >> "$LOG_FILE"; exit 0; }; \
    . "$ENV_FILE"; \
    TARGET=$(echo "<ip>" | grep -q ":" && echo "ip6" || echo "ip"); \
    echo "$(date '+%%d-%%m-%%Y %%H:%%M:%%S') [Cloudflare] 🟢 Unbanning <ip> from jail <name>" >> "$LOG_FILE"; \
    RULE_ID=$(curl -s -X GET "${CF_API}/zones/${ZONE_ID}/firewall/access_rules/rules" \
      -H "X-Auth-Email: ${CF_EMAIL}" -H "X-Auth-Key: ${API_KEY}" -H "Content-Type: application/json" \
      | jq -r ".result[] | select(.configuration.value==\"<ip>\" and .configuration.target==\"$TARGET\") | .id"); \
    if [ -n "$RULE_ID" ]; then \
      curl -s -X DELETE "${CF_API}/zones/${ZONE_ID}/firewall/access_rules/rules/${RULE_ID}" \
        -H "X-Auth-Email: ${CF_EMAIL}" -H "X-Auth-Key: ${API_KEY}" -H "Content-Type: application/json" \
        >> "$LOG_FILE" 2>&1; \
      echo "$(date '+%%d-%%m-%%Y %%H:%%M:%%S') [Cloudflare] ✅ Unbanned <ip> (rule ID: $RULE_ID)" >> "$LOG_FILE"; \
    else \
      echo "$(date '+%%d-%%m-%%Y %%H:%%M:%%S') [Cloudflare] ⚠️ No matching rule found for <ip>" >> "$LOG_FILE"; \
    fi; \
    echo "" >> "$LOG_FILE";
