# /etc/fail2ban/filter.d/nextcloud.conf
# Fail2Ban filter for Nextcloud JSON logs (complete version)
[Definition]
# Menangkap semua pasangan key:value JSON sebelum dan sesudah IP dan message
_groupsre = (?:(?:,?\s*"\w+":(?:"[^"]+"|\w+))*)

# Failregex menangkap berbagai tipe kegagalan login

failregex = ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Login failed:
            ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Two-factor challenge failed:
            ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Trusted domain error.
datepattern = ,?\s*"time"\s*:\s*"%%Y-%%m-%%d[T ]%%H:%%M:%%S(%%z)?"
# Tidak ada pola yang diabaikan
ignoreregex =