# ============================================
# /etc/fail2ban/jail.local
# Template siap pakai untuk SSHD, Nextcloud, Guacamole, Immich
# Dengan iptables + Telegram + Cloudflare
# ============================================

[DEFAULT]
# Email notifikasi (opsional)
destemail = fachmi@thismydomains.com
sender = noreply@thismydomains.com
mta = mail
protocol = tcp
bantime  = 3600           ; 1 jam
findtime = 600            ; 10 menit
maxretry = 5
backend = systemd

# Action default semua jail
action = iptables-custom-logging-ipv6
         telegram
         cloudflare-logging

# IP yang diabaikan
ignoreip = 127.0.0.1/8 192.168.55.0/28 192.168.60.0/28 192.168.49.254

# ============================================
# SSHD
# ============================================
[sshd]
enabled = true
port = ssh
filter = sshd
logpath = /var/log/auth.log
maxretry = 5
banaction = iptables-custom-logging-ipv6 telegram cloudflare-logging

# ============================================
# Nextcloud
# ============================================
[nextcloud]
enabled   = false
port      = 80,443
filter    = nextcloud
logpath   = /var/log/nextcloud/nextcloud.log
maxretry  = 5
banaction = iptables-custom-logging-ipv6 telegram cloudflare-logging

# ============================================
# Guacamole
# ============================================
[guacamole]
enabled  = false
port     = 8080,8443
filter   = guacamole
logpath  = /var/log/tomcat*/catalina.out
maxretry = 5
banaction = iptables-custom-logging-ipv6 telegram cloudflare-logging

# ============================================
# Immich
# ============================================
[immich]
enabled  = false
port     = 3000
filter   = immich
logpath  = /var/lib/immich/logs/*.log
maxretry = 5
banaction = iptables-custom-logging-ipv6 telegram cloudflare-logging
