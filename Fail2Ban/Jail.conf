# ============================================
# /etc/fail2ban/jail.local
# Template siap pakai untuk SSHD, Nextcloud, Guacamole, Immich
# Dengan iptables-custom-logging-ipv6 + Telegram + cloudflare-logging
# ============================================

[DEFAULT]
# Email notifikasi (opsional)
destemail = fachmi@thismydomains.com
sender = noreply@thismydomains.com
mta = mail
protocol = tcp
bantime  = 14400           ; 24 jam
findtime = 600            ; 10 menit
maxretry = 3
backend = auto
useDns = no


# Action default semua jail
action =  iptables-custom
          telegram cloudflare-logging

# IP yang diabaikan
ignoreip = 127.0.0.1/8 192.168.55.0/28 192.168.60.0/28 192.168.49.254

# ============================================
# SSHD
# ============================================
[sshd]
enabled = true
port = ssh
filter = sshd
logpath = /var/log/auth.log
maxretry = 3
backend = systemd
banaction = iptables-custom
            telegram cloudflare-logging

# ============================================
# Nextcloud
# ============================================
[nextcloud]
enabled   = false
port      = 80,443
filter    = nextcloud
logpath   = /var/log/nextcloud/nextcloud.log
maxretry  = 3
banaction = iptables-custom telegram cloudflare-logging
# ============================================
# Guacamole
# ============================================
[guacamole]
enabled   = false
port      = 8080,8443
filter    = guacamole
logpath   = /opt/apache-guacamole/tomcat9/logs/catalina.out
backend   = polling
maxretry  = 3
findtime  = 600
bantime   = 14400
banaction = iptables-custom telegram cloudflare-logging
# ============================================
# Immich
# ============================================
[immich]
enabled  = false
port     = 3000
filter   = immich
logpath  = /var/lib/immich/logs/*.log
maxretry = 3
banaction = iptables-custom telegram cloudflare-logging